<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ayutthaya 3D</title>
    <meta name="description" content="3D LiDAR scans from Ayutthaya">
    <meta property="og:title" content="Ayutthaya 3D">
    <meta property="og:description" content="3D LiDAR scans from Ayutthaya">

    <!-- Preconnect to CDNs for faster loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://www.gstatic.com">

    <!-- PWA -->
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
            height: 100%;
            width: 100%;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            width: 280px;
            max-height: calc(100vh - 20px);
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #controls::-webkit-scrollbar { display: none; }
        #controls h2 {
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
            color: #fff;
        }
        .control-section {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .control-section:last-child { border-bottom: none; }
        .control-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 10px;
        }
        .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .control-row label {
            flex: 0 0 80px;
            font-size: 12px;
        }
        .control-row input[type="range"] {
            flex: 1;
            margin: 0 8px;
        }
        .control-row input[type="number"] {
            width: 55px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 4px;
            border-radius: 4px;
            font-size: 11px;
        }
        .control-row input[type="color"] {
            width: 40px;
            height: 26px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        select {
            width: 100%;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        button {
            width: 100%;
            padding: 8px 12px;
            background: #4a9eff;
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 5px;
            transition: background 0.2s;
        }
        button:hover { background: #3a8eef; }
        button.secondary {
            background: #555;
        }
        button.secondary:hover { background: #666; }
        .checkbox-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .checkbox-row input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
        }
        .checkbox-row label {
            font-size: 13px;
            cursor: pointer;
        }
        #model-info, #camera-info {
            font-size: 11px;
            color: #888;
            background: #252525;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        #model-info { margin-top: 10px; margin-bottom: 0; }
        #model-info div, #camera-info div { margin-bottom: 4px; }
        #camera-info span, #model-info span { color: #aaa; font-family: monospace; }
        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(30, 30, 30, 0.95);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 100;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95);
            padding: 20px 30px;
            border-radius: 8px;
            z-index: 200;
            display: none;
            text-align: center;
            min-width: 200px;
        }
        #loading-text {
            margin-bottom: 12px;
            font-size: 14px;
        }
        #loading-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        #loading-progress {
            width: 0%;
            height: 100%;
            background: #4a9eff;
            border-radius: 2px;
            transition: width 0.1s ease-out;
        }
        #loading.indeterminate #loading-progress {
            width: 30%;
            animation: indeterminate 1.5s ease-in-out infinite;
        }
        @keyframes indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }
        .toggle-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 101;
            display: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-panel:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .toggle-panel::before {
            content: '☰';
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
        }
        #controls.hidden { display: none; }
        #controls.hidden + .toggle-panel { display: flex; align-items: center; justify-content: center; }
        .vec3-row {
            display: flex;
            gap: 4px;
        }
        .vec3-row input {
            flex: 1;
            width: 100%;
        }

        /* Mobile responsive styles */
        @media (max-width: 600px) {
            #controls {
                width: calc(100vw - 20px);
                max-width: 320px;
                padding: 12px;
                font-size: 14px;
            }
            #controls h2 {
                font-size: 14px;
                margin-bottom: 10px;
                padding-bottom: 8px;
            }
            .control-section h3 {
                font-size: 11px;
            }
            .control-row label {
                flex: 0 0 70px;
                font-size: 11px;
            }
            .control-row input[type="number"] {
                width: 50px;
                font-size: 10px;
                padding: 3px;
            }
            select, button {
                padding: 10px;
                font-size: 14px;
            }
            #stats {
                top: auto;
                bottom: 10px;
                right: 10px;
                padding: 8px 12px;
            }
            .toggle-panel {
                top: 10px;
                left: 10px;
                width: 36px;
                height: 36px;
            }
        }

        @media (max-width: 400px) {
            #controls {
                top: 5px;
                left: 5px;
                width: calc(100vw - 10px);
                max-height: calc(100vh - 10px);
                padding: 10px;
            }
        }

        /* Prevent pull-to-refresh on mobile */
        @supports (-webkit-touch-callout: none) {
            body {
                overscroll-behavior: none;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="controls">
        <h2>GLTF Viewer</h2>

        <div class="control-section">
            <h3>Model</h3>
            <select id="model-select">
                <option value="">Select a model...</option>
            </select>
            <button id="reload-btn" class="secondary">Reload Model</button>
        </div>

        <div class="control-section">
            <h3>Display</h3>
            <div class="checkbox-row">
                <input type="checkbox" id="wireframe">
                <label for="wireframe">Wireframe</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="grid">
                <label for="grid">Grid</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="axes">
                <label for="axes">Axes Helper</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="bounding-box">
                <label for="bounding-box">Bounding Box</label>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="auto-rotate">
                <label for="auto-rotate">Auto Rotate</label>
            </div>
            <div class="control-row">
                <label>Background</label>
                <input type="color" id="bg-color" value="#1a1a1a">
            </div>
        </div>

        <div class="control-section">
            <h3>Transform</h3>
            <div class="control-row">
                <label>Position X</label>
                <input type="range" id="pos-x" min="-10" max="10" step="0.1" value="0">
                <input type="number" id="pos-x-num" value="0" step="0.1">
            </div>
            <div class="control-row">
                <label>Position Y</label>
                <input type="range" id="pos-y" min="-10" max="10" step="0.1" value="0">
                <input type="number" id="pos-y-num" value="0" step="0.1">
            </div>
            <div class="control-row">
                <label>Position Z</label>
                <input type="range" id="pos-z" min="-10" max="10" step="0.1" value="0">
                <input type="number" id="pos-z-num" value="0" step="0.1">
            </div>
            <div class="control-row">
                <label>Rotation X</label>
                <input type="range" id="rot-x" min="-180" max="180" step="1" value="0">
                <input type="number" id="rot-x-num" value="0" step="1">
            </div>
            <div class="control-row">
                <label>Rotation Y</label>
                <input type="range" id="rot-y" min="-180" max="180" step="1" value="0">
                <input type="number" id="rot-y-num" value="0" step="1">
            </div>
            <div class="control-row">
                <label>Rotation Z</label>
                <input type="range" id="rot-z" min="-180" max="180" step="1" value="0">
                <input type="number" id="rot-z-num" value="0" step="1">
            </div>
            <div class="control-row">
                <label>Scale</label>
                <input type="range" id="scale" min="0.1" max="5" step="0.1" value="1">
                <input type="number" id="scale-num" value="1" step="0.1">
            </div>
            <button id="reset-transform" class="secondary">Reset Transform</button>
        </div>

        <div class="control-section">
            <h3>Lighting</h3>
            <div class="control-row">
                <label>Ambient</label>
                <input type="range" id="ambient-intensity" min="0" max="2" step="0.1" value="0.5">
                <input type="number" id="ambient-intensity-num" value="0.5" step="0.1">
            </div>
            <div class="control-row">
                <label>Ambient Color</label>
                <input type="color" id="ambient-color" value="#ffffff">
            </div>
            <div class="control-row">
                <label>Directional</label>
                <input type="range" id="dir-intensity" min="0" max="3" step="0.1" value="1">
                <input type="number" id="dir-intensity-num" value="1" step="0.1">
            </div>
            <div class="control-row">
                <label>Dir Color</label>
                <input type="color" id="dir-color" value="#ffffff">
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="shadows" checked>
                <label for="shadows">Cast Shadows</label>
            </div>
        </div>

        <div class="control-section">
            <h3>Camera</h3>
            <div id="camera-info">
                <div>Position: <span id="cam-pos">0, 0, 0</span></div>
                <div>Pivot: <span id="cam-target">0, 0, 0</span></div>
            </div>
            <div class="control-row">
                <label>FOV</label>
                <input type="range" id="fov" min="20" max="120" step="1" value="50">
                <input type="number" id="fov-num" value="50" step="1">
            </div>
            <div class="control-row">
                <label>Near</label>
                <input type="range" id="near" min="0.01" max="1" step="0.01" value="0.1">
                <input type="number" id="near-num" value="0.1" step="0.01">
            </div>
            <div class="control-row">
                <label>Far</label>
                <input type="range" id="far" min="100" max="10000" step="100" value="1000">
                <input type="number" id="far-num" value="1000" step="100">
            </div>
            <button id="reset-camera" class="secondary">Reset Camera</button>
            <button id="fit-camera" class="secondary">Fit to Model</button>
        </div>

        <div class="control-section">
            <h3>Model Info</h3>
            <div id="model-info">
                <div>Vertices: <span id="info-vertices">-</span></div>
                <div>Triangles: <span id="info-triangles">-</span></div>
                <div>Meshes: <span id="info-meshes">-</span></div>
                <div>Materials: <span id="info-materials">-</span></div>
                <div>Textures: <span id="info-textures">-</span></div>
            </div>
        </div>

        <button id="toggle-panel">Hide Panel (H)</button>
    </div>

    <button class="toggle-panel" id="show-panel" title="Show Panel (H)"></button>

    <div id="stats">
        <div>FPS: <span id="fps">0</span></div>
    </div>

    <div id="loading" class="indeterminate">
        <div id="loading-text">Loading model...</div>
        <div id="loading-bar"><div id="loading-progress"></div></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // DOM helpers
        const $ = id => document.getElementById(id);
        const on = (el, evt, fn) => (typeof el === 'string' ? $(el) : el).addEventListener(evt, fn);

        // Cached DOM refs
        const dom = {
            container: $('canvas-container'),
            controls: $('controls'),
            loading: $('loading'),
            modelSelect: $('model-select'),
            fps: $('fps'),
            camPos: $('cam-pos'),
            camTarget: $('cam-target'),
        };

        // Config
        const CONFIG = {
            moveSpeed: 0.1,
            presets: {
                '1.glb': { pos: [17.77, 16.52, -4.36], target: [-0.63, -2.23, 1.65] },
                '2.glb': { pos: [5.92, 5.00, 6.77], target: [-0.16, -0.75, 0.03] },
                '3.glb': { pos: [6.86, 3.29, 7.76], target: [-1.9, -2.79, -1.66] },
            },
            models: [
                { name: 'Wat Chaiwatthanaram', filename: '3.glb' },
                { name: 'Wat Mahathat', filename: '1.glb' },
                { name: 'Wat Yai Chai Mongkhon', filename: '2.glb' },
            ],
        };

        // State
        let currentModel = null;
        let boundingBoxHelper = null;
        let urlUpdateTimeout;
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };

        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a1a1a');

        const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        dom.container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        Object.assign(controls, {
            enableDamping: true,
            dampingFactor: 0.05,
            screenSpacePanning: true,
            minDistance: 0.1,
            maxDistance: 500,
        });
        controls.addEventListener('change', () => scheduleURLUpdate?.());

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7.5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.1;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -10;
        directionalLight.shadow.camera.right = 10;
        directionalLight.shadow.camera.top = 10;
        directionalLight.shadow.camera.bottom = -10;
        scene.add(ambientLight, directionalLight);

        // Helpers (off by default)
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x333333);
        const axesHelper = new THREE.AxesHelper(5);
        gridHelper.visible = axesHelper.visible = false;
        scene.add(gridHelper, axesHelper);

        // Pivot marker
        const pivotMarker = new THREE.Mesh(
            new THREE.SphereGeometry(0.1, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0.8 })
        );
        pivotMarker.visible = false;
        scene.add(pivotMarker);

        // Raycaster
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Loader
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        // URL encoding (binary packed, URL-safe base64)
        // Format: model(4b) + fov(7b) + 6 coords(96b) + flags(6b) + bgColor(24b) = 18 bytes → 24 chars
        const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
        const B64_INV = Object.fromEntries([...B64].map((c, i) => [c, i]));

        const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
        const toSigned16 = v => clamp(Math.round(v * 100), -32768, 32767);
        const toUnsigned = v => v < 0 ? v + 65536 : v;
        const fromUnsigned = v => v > 32767 ? v - 65536 : v;

        function getDisplayFlags() {
            return ($('wireframe')?.checked ? 1 : 0) |
                   ($('grid')?.checked ? 2 : 0) |
                   ($('axes')?.checked ? 4 : 0) |
                   ($('bounding-box')?.checked ? 8 : 0) |
                   ($('auto-rotate')?.checked ? 16 : 0) |
                   ($('shadows')?.checked ? 32 : 0);
        }

        function getBgColor() {
            const hex = $('bg-color')?.value || '#1a1a1a';
            return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
        }

        function encodeState(model, pos, target, fov) {
            const modelId = parseInt(model) - 1;
            const fovVal = clamp(Math.round(fov), 20, 120) - 20;
            const floats = [pos.x, pos.y, pos.z, target.x, target.y, target.z];
            const flags = getDisplayFlags();
            const [bgR, bgG, bgB] = getBgColor();

            const bytes = new Uint8Array(18);
            bytes[0] = (modelId << 4) | (fovVal >> 3);
            bytes[1] = (fovVal << 5) & 0xFF;

            let bitPos = 3, bytePos = 1;
            for (const f of floats) {
                const uval = toUnsigned(toSigned16(f));
                bytes[bytePos] |= (uval >> (16 - bitPos)) & 0xFF;
                bytePos++;
                if (bitPos < 8) { bytes[bytePos] = (uval >> (8 - bitPos)) & 0xFF; bytePos++; }
                bytes[bytePos] = (uval << bitPos) & 0xFF;
            }

            // Flags and background color
            bytes[14] = flags;
            bytes[15] = bgR;
            bytes[16] = bgG;
            bytes[17] = bgB;

            let result = '';
            for (let i = 0; i < 18; i += 3) {
                const [b0, b1, b2] = [bytes[i], bytes[i + 1] ?? 0, bytes[i + 2] ?? 0];
                result += B64[b0 >> 2] + B64[((b0 & 3) << 4) | (b1 >> 4)];
                if (i + 1 < 18) result += B64[((b1 & 15) << 2) | (b2 >> 6)];
                if (i + 2 < 18) result += B64[b2 & 63];
            }
            return result;
        }

        function decodeState(str) {
            if (str?.length < 19) return null;
            try {
                const bytes = new Uint8Array(18);
                for (let i = 0, j = 0; i < str.length && j < 18; i += 4) {
                    const [b0, b1, b2, b3] = [B64_INV[str[i]], B64_INV[str[i + 1]] ?? 0, B64_INV[str[i + 2]] ?? 0, B64_INV[str[i + 3]] ?? 0];
                    bytes[j++] = (b0 << 2) | (b1 >> 4);
                    if (j < 18) bytes[j++] = ((b1 & 15) << 4) | (b2 >> 2);
                    if (j < 18) bytes[j++] = ((b2 & 3) << 6) | b3;
                }

                const modelId = bytes[0] >> 4;
                const fov = (((bytes[0] & 0xF) << 3) | (bytes[1] >> 5)) + 20;

                const floats = [];
                let bitPos = 3, bytePos = 1;
                for (let i = 0; i < 6; i++) {
                    let uval = (bytes[bytePos] << (16 - bitPos)) & 0xFFFF;
                    bytePos++;
                    if (bitPos < 8) { uval |= (bytes[bytePos] << (8 - bitPos)) & 0xFFFF; bytePos++; }
                    uval |= bytes[bytePos] >> bitPos;
                    floats.push(fromUnsigned(uval) / 100);
                }

                // Flags and background (may not exist in old URLs)
                const flags = bytes[14] ?? 0;
                const bgColor = bytes[15] !== undefined
                    ? `#${bytes[15].toString(16).padStart(2, '0')}${bytes[16].toString(16).padStart(2, '0')}${bytes[17].toString(16).padStart(2, '0')}`
                    : '#1a1a1a';

                return {
                    model: `${modelId + 1}.glb`,
                    fov,
                    pos: { x: floats[0], y: floats[1], z: floats[2] },
                    target: { x: floats[3], y: floats[4], z: floats[5] },
                    flags: {
                        wireframe: !!(flags & 1),
                        grid: !!(flags & 2),
                        axes: !!(flags & 4),
                        boundingBox: !!(flags & 8),
                        autoRotate: !!(flags & 16),
                        shadows: !!(flags & 32),
                    },
                    bgColor,
                };
            } catch { return null; }
        }

        const getURLState = () => decodeState(new URLSearchParams(location.search).get('v'));

        function updateURL() {
            const model = dom.modelSelect.value;
            if (!model) return;
            const state = encodeState(model, camera.position, controls.target, camera.fov);
            history.replaceState(null, '', `?v=${state}`);
        }

        function scheduleURLUpdate() {
            clearTimeout(urlUpdateTimeout);
            urlUpdateTimeout = setTimeout(updateURL, 500);
        }

        // Model loading
        const isGitHubPages = location.hostname.includes('github.io');
        const modelBasePath = isGitHubPages ? '.' : '/models';

        function disposeModel(model) {
            model?.traverse(child => {
                child.geometry?.dispose();
                [].concat(child.material ?? []).forEach(m => m.dispose());
            });
        }

        function loadModel(filename) {
            if (!filename) return;

            const loadingEl = dom.loading;
            const progressEl = $('loading-progress');
            const textEl = $('loading-text');

            loadingEl.classList.add('indeterminate');
            loadingEl.style.display = 'block';
            textEl.textContent = 'Loading model...';
            progressEl.style.width = '0%';

            if (currentModel) {
                scene.remove(currentModel);
                disposeModel(currentModel);
            }
            if (boundingBoxHelper) {
                scene.remove(boundingBoxHelper);
                boundingBoxHelper = null;
            }

            loader.load(
                `${modelBasePath}/${filename}`,
                ({ scene: model }) => {
                    currentModel = model;
                    model.traverse(child => {
                        if (child.isMesh) child.castShadow = child.receiveShadow = true;
                    });
                    scene.add(model);
                    updateModelInfo();
                    resetTransform();
                    applyCameraPreset(filename);
                    updateBoundingBox();
                    loadingEl.style.display = 'none';
                },
                (progress) => {
                    if (progress.lengthComputable) {
                        loadingEl.classList.remove('indeterminate');
                        const pct = (progress.loaded / progress.total * 100).toFixed(0);
                        progressEl.style.width = `${pct}%`;
                        const mb = (progress.loaded / 1024 / 1024).toFixed(1);
                        textEl.textContent = `Loading... ${pct}% (${mb} MB)`;
                    }
                },
                err => {
                    console.error('Error loading model:', err);
                    loadingEl.style.display = 'none';
                    alert(`Error loading model: ${err.message}`);
                }
            );
        }

        function applyDisplayFlags(flags, bgColor) {
            // Apply flags to UI and scene
            $('wireframe').checked = flags.wireframe;
            $('grid').checked = flags.grid;
            $('axes').checked = flags.axes;
            $('bounding-box').checked = flags.boundingBox;
            $('auto-rotate').checked = flags.autoRotate;
            $('shadows').checked = flags.shadows;
            $('bg-color').value = bgColor;

            setWireframe(flags.wireframe);
            gridHelper.visible = flags.grid;
            axesHelper.visible = flags.axes;
            controls.autoRotate = flags.autoRotate;
            renderer.shadowMap.enabled = flags.shadows;
            scene.background = new THREE.Color(bgColor);
        }

        function applyCameraPreset(filename) {
            const urlState = getURLState();
            if (urlState?.model === filename) {
                const { pos, target, fov, flags, bgColor } = urlState;
                camera.position.set(pos.x, pos.y, pos.z);
                controls.target.set(target.x, target.y, target.z);
                camera.fov = fov;
                camera.updateProjectionMatrix();
                $('fov').value = $('fov-num').value = fov;
                if (flags) applyDisplayFlags(flags, bgColor);
            } else {
                const preset = CONFIG.presets[filename];
                if (preset) {
                    camera.position.set(...preset.pos);
                    controls.target.set(...preset.target);
                } else {
                    fitCameraToModel();
                }
            }
            controls.update();
            updateURL();
        }

        async function loadModelsList() {
            let models = CONFIG.models;
            if (!isGitHubPages) {
                try {
                    const res = await fetch('/models');
                    if (res.ok) models = await res.json();
                } catch {}
            }

            models.forEach(({ name, filename }) => {
                const opt = document.createElement('option');
                opt.value = filename;
                opt.textContent = name;
                dom.modelSelect.appendChild(opt);
            });

            const urlState = getURLState();
            const initial = urlState?.model ?? models[0]?.filename;
            if (initial && models.some(m => m.filename === initial)) {
                dom.modelSelect.value = initial;
                loadModel(initial);
            }
        }

        // Model utilities
        function updateModelInfo() {
            if (!currentModel) return;
            let vertices = 0, triangles = 0, meshes = 0;
            const materials = new Set(), textures = new Set();

            currentModel.traverse(child => {
                if (!child.isMesh) return;
                meshes++;
                const geo = child.geometry;
                vertices += geo?.attributes.position?.count ?? 0;
                triangles += geo?.index?.count / 3 ?? geo?.attributes.position?.count / 3 ?? 0;

                [].concat(child.material ?? []).forEach(m => {
                    materials.add(m.uuid);
                    ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap']
                        .forEach(p => m[p] && textures.add(m[p].uuid));
                });
            });

            $('info-vertices').textContent = vertices.toLocaleString();
            $('info-triangles').textContent = Math.floor(triangles).toLocaleString();
            $('info-meshes').textContent = meshes;
            $('info-materials').textContent = materials.size;
            $('info-textures').textContent = textures.size;
        }

        function fitCameraToModel() {
            if (!currentModel) return;
            const box = new THREE.Box3().setFromObject(currentModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const dist = Math.max(...size.toArray()) / Math.sin(camera.fov * Math.PI / 360) * 1.2;
            camera.position.set(center.x + dist * 0.5, center.y + dist * 0.5, center.z + dist);
            controls.target.copy(center);
            controls.update();
        }

        function resetTransform() {
            if (!currentModel) return;
            currentModel.position.set(0, 0, 0);
            currentModel.rotation.set(0, 0, 0);
            currentModel.scale.set(1, 1, 1);

            ['pos-x', 'pos-y', 'pos-z', 'rot-x', 'rot-y', 'rot-z'].forEach(id => {
                $(id).value = $(`${id}-num`).value = 0;
            });
            $('scale').value = $('scale-num').value = 1;
            updateBoundingBox();
        }

        function updateBoundingBox() {
            if (boundingBoxHelper) scene.remove(boundingBoxHelper);
            boundingBoxHelper = null;
            if (currentModel && $('bounding-box').checked) {
                boundingBoxHelper = new THREE.Box3Helper(new THREE.Box3().setFromObject(currentModel), 0x00ff00);
                scene.add(boundingBoxHelper);
            }
        }

        function setWireframe(enabled) {
            currentModel?.traverse(child => {
                if (child.isMesh) [].concat(child.material ?? []).forEach(m => m.wireframe = enabled);
            });
        }

        // UI setup
        function linkInputs(sliderId, callback) {
            const slider = $(sliderId), num = $(`${sliderId}-num`);
            on(slider, 'input', () => { num.value = slider.value; callback(+slider.value); });
            on(num, 'change', () => { slider.value = num.value; callback(+num.value); });
        }

        function setupUI() {
            on('model-select', 'change', e => loadModel(e.target.value));
            on('reload-btn', 'click', () => dom.modelSelect.value && loadModel(dom.modelSelect.value));

            // Display (all trigger URL update for sharing)
            on('wireframe', 'change', e => { setWireframe(e.target.checked); scheduleURLUpdate(); });
            on('grid', 'change', e => { gridHelper.visible = e.target.checked; scheduleURLUpdate(); });
            on('axes', 'change', e => { axesHelper.visible = e.target.checked; scheduleURLUpdate(); });
            on('bounding-box', 'change', () => { updateBoundingBox(); scheduleURLUpdate(); });
            on('auto-rotate', 'change', e => { controls.autoRotate = e.target.checked; scheduleURLUpdate(); });
            on('bg-color', 'input', e => { scene.background = new THREE.Color(e.target.value); scheduleURLUpdate(); });
            on('shadows', 'change', e => {
                renderer.shadowMap.enabled = e.target.checked;
                currentModel?.traverse(c => { if (c.isMesh) c.castShadow = c.receiveShadow = e.target.checked; });
                scheduleURLUpdate();
            });

            // Transform
            const updatePos = axis => v => { if (currentModel) { currentModel.position[axis] = v; updateBoundingBox(); } };
            const updateRot = axis => v => { if (currentModel) { currentModel.rotation[axis] = THREE.MathUtils.degToRad(v); updateBoundingBox(); } };
            linkInputs('pos-x', updatePos('x'));
            linkInputs('pos-y', updatePos('y'));
            linkInputs('pos-z', updatePos('z'));
            linkInputs('rot-x', updateRot('x'));
            linkInputs('rot-y', updateRot('y'));
            linkInputs('rot-z', updateRot('z'));
            linkInputs('scale', v => { if (currentModel) { currentModel.scale.setScalar(v); updateBoundingBox(); } });
            on('reset-transform', 'click', resetTransform);

            // Lighting
            linkInputs('ambient-intensity', v => ambientLight.intensity = v);
            linkInputs('dir-intensity', v => directionalLight.intensity = v);
            on('ambient-color', 'input', e => ambientLight.color.set(e.target.value));
            on('dir-color', 'input', e => directionalLight.color.set(e.target.value));

            // Camera
            linkInputs('fov', v => { camera.fov = v; camera.updateProjectionMatrix(); });
            linkInputs('near', v => { camera.near = v; camera.updateProjectionMatrix(); });
            linkInputs('far', v => { camera.far = v; camera.updateProjectionMatrix(); });
            on('reset-camera', 'click', () => { camera.position.set(5, 5, 5); controls.target.set(0, 0, 0); controls.update(); });
            on('fit-camera', 'click', fitCameraToModel);

            // Panel toggle
            on('toggle-panel', 'click', () => dom.controls.classList.add('hidden'));
            on('show-panel', 'click', () => dom.controls.classList.remove('hidden'));
        }

        // Input handling
        function setupInput() {
            on(document, 'keydown', e => {
                const key = e.key.toLowerCase();
                if (key in keys) keys[key] = true;
                if (e.key === 'Shift') keys.shift = true;
                if (e.key === ' ') { keys.space = true; e.preventDefault(); }
                if (key === 'h') dom.controls.classList.toggle('hidden');
            });

            on(document, 'keyup', e => {
                const key = e.key.toLowerCase();
                if (key in keys) keys[key] = false;
                if (e.key === 'Shift') keys.shift = false;
                if (e.key === ' ') keys.space = false;
            });

            on(window, 'blur', () => Object.keys(keys).forEach(k => keys[k] = false));

            // Ctrl+click pivot
            on(renderer.domElement, 'mousedown', e => {
                if ((!e.ctrlKey && !e.metaKey) || !currentModel) return;
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.set((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1);
                raycaster.setFromCamera(mouse, camera);
                const [hit] = raycaster.intersectObject(currentModel, true);
                if (hit) {
                    controls.target.copy(hit.point);
                    controls.update();
                    pivotMarker.position.copy(hit.point);
                    pivotMarker.visible = true;
                    setTimeout(() => pivotMarker.visible = false, 1500);
                    scheduleURLUpdate();
                }
            });

            on(window, 'resize', () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });
        }

        // Animation
        const direction = new THREE.Vector3();
        const right = new THREE.Vector3();
        let frameCount = 0, lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            // WASD movement
            const { moveSpeed } = CONFIG;
            camera.getWorldDirection(direction).setY(0).normalize();
            right.crossVectors(direction, camera.up).normalize();

            if (keys.w) { camera.position.addScaledVector(direction, moveSpeed); controls.target.addScaledVector(direction, moveSpeed); }
            if (keys.s) { camera.position.addScaledVector(direction, -moveSpeed); controls.target.addScaledVector(direction, -moveSpeed); }
            if (keys.a) { camera.position.addScaledVector(right, -moveSpeed); controls.target.addScaledVector(right, -moveSpeed); }
            if (keys.d) { camera.position.addScaledVector(right, moveSpeed); controls.target.addScaledVector(right, moveSpeed); }
            if (keys.shift) { camera.position.y -= moveSpeed; controls.target.y -= moveSpeed; }
            if (keys.space) { camera.position.y += moveSpeed; controls.target.y += moveSpeed; }

            controls.update();
            renderer.render(scene, camera);

            // FPS counter
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                dom.fps.textContent = frameCount;
                frameCount = 0;
                lastTime = now;
            }

            // Camera info
            const { x: px, y: py, z: pz } = camera.position;
            const { x: tx, y: ty, z: tz } = controls.target;
            dom.camPos.textContent = `${px.toFixed(2)}, ${py.toFixed(2)}, ${pz.toFixed(2)}`;
            dom.camTarget.textContent = `${tx.toFixed(2)}, ${ty.toFixed(2)}, ${tz.toFixed(2)}`;
        }

        // Init
        setupUI();
        setupInput();
        loadModelsList();
        animate();

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
    </script>
</body>
</html>
